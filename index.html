<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монголын Тариалангийн Туслах | Mongolian Crop Co-Pilot</title>

  <!-- Apply saved / system theme before anything paints -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("cropCopilotTheme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        colors: {
          forest: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' }
        }
      } }
    };
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="antialiased min-h-screen flex flex-col">

  <!-- ================= HEADER ================= -->
  <header class="bg-forest-800 text-white shadow-md sm:sticky top-0 z-[1000]">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3.5 flex items-center justify-between gap-2 sm:gap-3">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-forest-700 border border-forest-600 flex items-center justify-center shadow-inner shrink-0">
          <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21V9m0 0c0-3.5 2.5-6 6-6 0 3.5-2.5 6-6 6zm0 4c0-3.5-2.5-6-6-6 0 3.5 2.5 6 6 6z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 data-i18n="appTitle" class="text-[15px] sm:text-xl font-extrabold tracking-tight leading-tight">Монголын Тариалангийн Туслах</h1>
            <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/20 text-amber-200 border border-amber-400/30">NASA Space Apps 2026</span>
          </div>
          <p data-i18n="appSubtitle" class="hidden sm:block text-xs sm:text-sm text-emerald-100/90"></p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <button id="btn-theme" onclick="toggleTheme()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-forest-900/80 border border-forest-600/70 flex items-center justify-center text-base hover:bg-forest-900 transition-colors" aria-label="Dark mode">🌙</button>
      <div class="flex items-center bg-forest-900/80 p-1 rounded-full border border-forest-600/70 shadow-sm">
        <button id="btn-lang-mn" onclick="setLanguage('mn')" aria-label="Монгол хэл сонгох"><span>🇲🇳</span><span class="hidden sm:inline">Монгол</span><span class="sm:hidden">МН</span></button>
        <button id="btn-lang-en" onclick="setLanguage('en')" aria-label="Switch to English"><span>🇬🇧</span><span class="hidden sm:inline">English</span><span class="sm:hidden">EN</span></button>
      </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 sm:py-8 space-y-5 sm:space-y-6 flex-grow">

    <!-- ================= 1. MAP ================= -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-4 sm:px-6 py-3.5 bg-slate-50/80 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-start gap-2">
          <svg class="w-5 h-5 text-red-600 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
          <div>
            <h2 data-i18n="mapHeading" class="text-sm sm:text-base font-bold text-slate-800"></h2>
            <p data-i18n="mapHint" class="hidden sm:block text-xs text-slate-500 max-w-2xl"></p>
          </div>
        </div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-forest-50 text-forest-800 border border-forest-200 self-start sm:self-center max-w-full truncate">
          <span class="w-2 h-2 rounded-full bg-forest-600 animate-ping"></span>
          <span id="ui-active-location" class="truncate"></span>
        </span>
      </div>

      <div class="relative w-full h-[58vh] min-h-[340px] max-h-[520px] sm:h-[460px] sm:max-h-none lg:h-[500px] bg-slate-200">
        <div id="mongolia-map" class="w-full h-full z-0"></div>

        <div id="map-type-control" class="absolute top-3 left-3 z-[500] bg-white rounded-lg shadow-md border border-slate-200/90 flex overflow-hidden">
          <button id="btn-layer-street" onclick="setMapLayer('street')"><span>🗺️</span><span data-i18n="layerMap" class="hidden sm:inline"></span></button>
          <button id="btn-layer-satellite" onclick="setMapLayer('satellite')"><span>🛰️</span><span data-i18n="layerSat" class="hidden sm:inline"></span></button>
        </div>

        <button id="btn-locate" onclick="locateMe()" class="absolute top-[56px] sm:top-[60px] left-3 z-[500] bg-white rounded-lg shadow-md border border-slate-200/90 px-3 sm:px-3.5 py-2 text-xs sm:text-sm font-bold text-blue-700 hover:bg-slate-50 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path stroke-linecap="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="7.5"/></svg>
          <span data-i18n="locateMe" class="hidden sm:inline"></span>
        </button>

        <div id="map-toast" class="hidden-toast absolute bottom-3 sm:bottom-auto sm:top-14 left-1/2 -translate-x-1/2 z-[600] px-4 py-2 rounded-xl bg-slate-900/90 text-white text-xs sm:text-sm font-semibold shadow-lg w-max max-w-[78%] sm:max-w-[90%] text-center"></div>

        <div id="map-quick-pills" class="hidden sm:flex absolute bottom-6 left-3 z-[500] flex-wrap items-center gap-1.5 max-w-[80%]"></div>
      </div>

      <!-- Phones: region buttons as a swipeable strip + jump to results -->
      <div class="sm:hidden border-t border-slate-200 bg-slate-50">
        <div id="map-quick-pills-mobile" class="flex flex-nowrap gap-1.5 overflow-x-auto px-3 py-2.5 no-scrollbar"></div>
        <button id="btn-see-results" onclick="scrollToResults()" class="hidden w-full py-2.5 text-sm font-bold text-white bg-forest-700 active:bg-forest-800"></button>
      </div>
    </section>

    <!-- ================= 2. ALERT BANNER ================= -->
    <section id="alert-banner" class="rounded-2xl border-l-4 p-4 sm:p-5 shadow-sm transition-all duration-300 border-slate-300 bg-slate-50">
      <div class="flex items-start gap-3.5">
        <div id="alert-icon" class="p-2 rounded-xl shrink-0 mt-0.5 bg-slate-100 text-slate-600 text-xl leading-none w-10 h-10 flex items-center justify-center">⏳</div>
        <div class="space-y-1">
          <div class="flex flex-wrap items-center gap-2">
            <span id="alert-title" class="font-extrabold text-sm sm:text-base text-slate-900"></span>
            <span id="alert-tag" class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-slate-200 text-slate-700"></span>
          </div>
          <p id="alert-desc" class="text-xs sm:text-sm leading-relaxed text-slate-700"></p>
          <p id="alert-note" class="text-[11px] sm:text-xs text-slate-500 italic"></p>
        </div>
      </div>
    </section>

    <!-- ================= 3. NASA METRICS ================= -->
    <section class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h3 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2"><span>🛰️</span><span data-i18n="metricsTitle"></span></h3>
        <div id="nasa-status-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold border">
          <span id="nasa-status-dot" class="w-2 h-2 rounded-full"></span>
          <span id="nasa-status-text"></span>
        </div>
      </div>
      <div id="metric-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></div>

      <!-- Year-by-year chart -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-3 sm:p-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
          <h4 data-i18n="chartTitle" class="text-sm font-bold text-slate-700"></h4>
          <div id="chart-tabs" class="flex flex-nowrap sm:flex-wrap gap-1 overflow-x-auto no-scrollbar max-w-full"></div>
        </div>
        <div id="year-chart" class="w-full"></div>
      </div>
    </section>

    <!-- ================= 4. CROP SUITABILITY ================= -->
    <section class="space-y-3">
      <div>
        <h3 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2"><span>🌱</span><span data-i18n="cropsHeading"></span></h3>
        <p data-i18n="cropsSub" class="text-xs sm:text-sm text-slate-500"></p>
      </div>
      <div id="pasture-note" class="hidden rounded-xl border border-amber-300 bg-amber-50 text-amber-900 text-sm p-3.5"></div>
      <div id="crop-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5 sm:gap-3"></div>
      <button id="btn-more-crops" onclick="toggleAllCrops()" class="sm:hidden w-full py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold text-forest-700"></button>
    </section>

    <!-- ================= 5. STRATEGIES ================= -->
    <section class="space-y-4">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3">
        <div>
          <h3 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2"><span>🔄</span><span data-i18n="strategyHeading"></span></h3>
          <p data-i18n="strategySub" class="text-xs sm:text-sm text-slate-500"></p>
        </div>
        <!-- Farmer inputs -->
        <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm space-y-2">
          <p data-i18n="controlsHeading" class="text-xs font-bold text-slate-600"></p>
          <div id="priority-buttons" class="flex flex-wrap gap-1"></div>
          <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer select-none">
            <input id="irrigation-toggle" type="checkbox" class="w-4 h-4 accent-green-700" onchange="setIrrigation(this.checked)" />
            <span>💧 <span data-i18n="irrigationLabel"></span></span>
          </label>
        </div>
      </div>

      <div id="strategy-cards-grid" class="flex sm:grid sm:grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4 overflow-x-auto sm:overflow-visible snap-x snap-mandatory pb-2 sm:pb-0 -mx-3 px-3 sm:mx-0 sm:px-0 no-scrollbar"></div>
      <div id="strategy-detail-panel" class="bg-white rounded-2xl border border-forest-200 p-4 sm:p-6 shadow-sm"></div>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200">
          <h4 data-i18n="tableHeading" class="text-sm font-bold text-slate-700"></h4>
        </div>
        <div id="strategy-list-mobile" class="sm:hidden divide-y divide-slate-100"></div>
        <div class="hidden sm:block overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead>
              <tr class="bg-slate-50/60 text-slate-500 border-b border-slate-200">
                <th data-i18n="thStrategy" class="px-4 py-3 font-bold"></th>
                <th data-i18n="thCrops" class="px-4 py-3 font-bold"></th>
                <th data-i18n="thFit" class="px-4 py-3 font-bold"></th>
                <th data-i18n="thSoil" class="px-4 py-3 font-bold"></th>
                <th data-i18n="thWater" class="px-4 py-3 font-bold"></th>
                <th data-i18n="thFeed" class="px-4 py-3 font-bold"></th>
              </tr>
            </thead>
            <tbody id="strategy-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="bg-slate-900 text-slate-300 mt-10 border-t border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-6 sm:py-8 space-y-4">
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex items-start gap-3">
        <svg class="w-5 h-5 text-amber-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <div class="space-y-1.5">
          <p data-i18n="disclaimer" class="text-xs sm:text-sm text-slate-200 leading-relaxed"></p>
          <p data-i18n="resolutionNote" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-2 text-xs text-slate-400 pt-1">
        <div class="space-y-1">
          <p data-i18n="footerSources"></p>
          <p data-i18n="footerMethod"></p>
        </div>
        <p class="whitespace-nowrap">2026 NASA Space Apps Challenge • Field Shift</p>
      </div>
    </div>
  </footer>

  <!-- Order matters: data → translations → NASA → scoring → app -->
  <script src="js/mongolia-border.js"></script>
  <script src="js/mongolia-lakes.js"></script>
  <script src="js/mongolia-aimags.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nasa.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
