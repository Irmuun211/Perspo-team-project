<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agricola — Монголын тариалангийн туслах | Mongolian Crop Co-Pilot</title>

  <!-- Apply saved / system theme before anything paints -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("cropCopilotTheme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (t === "dark") document.documentElement.classList.add("dark");
    })();
  </script>

  <!-- Fonts: Inter (display), Public Sans (body), DM Mono (data), Instrument Serif italic (logo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Earth-toned glow at the top of the Map tab, and the glow that follows the mouse -->
  <div id="ground" aria-hidden="true"></div>
  <div id="cursor-glow" aria-hidden="true"></div>

  <!-- ================= TOP BAR ================= -->
  <header id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#map" onclick="goTab('map'); return false;" aria-label="Agricola">
        <span class="brand-word" aria-hidden="true"><span class="lt" style="--n:0">A</span><span class="lt" style="--n:1">g</span><span class="lt" style="--n:2">r</span><span class="lt" style="--n:3">i</span><span class="lt" style="--n:4">c</span><span class="lt" style="--n:5">o</span><span class="lt" style="--n:6">l</span><span class="lt" style="--n:7">a</span></span>
      </a>

      <nav id="tabbar" role="tablist" aria-label="Sections">
        <span id="tab-highlight" aria-hidden="true"></span>
        <button class="tab" role="tab" data-tab="map"><span data-i18n="tabMap"></span></button>
        <button class="tab" role="tab" data-tab="crops"><span data-i18n="tabCrops"></span></button>
        <button class="tab" role="tab" data-tab="rotations"><span data-i18n="tabRotations"></span></button>
        <button class="tab" role="tab" data-tab="about"><span data-i18n="tabAbout"></span></button>
      </nav>

      <div class="topbar-actions">
        <button id="btn-theme" class="icon-btn" onclick="toggleTheme(event)" aria-label="Dark mode">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke-linejoin="round"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        </button>
        <div class="lang-switch mono" role="group" aria-label="Language">
          <span class="lang-thumb" aria-hidden="true"></span>
          <button id="btn-lang-mn" onclick="setLanguage('mn')" aria-label="Монгол хэл" data-lang="mn">МН</button>
          <button id="btn-lang-en" onclick="setLanguage('en')" aria-label="English" data-lang="en">EN</button>
        </div>
      </div>

      <!-- Phones: menu button opens the side bar -->
      <button id="btn-menu" class="menu-btn" onclick="toggleSidebar()" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="context-strip mono">
      <div class="context-inner">
        <span><i class="loc-dot" aria-hidden="true"></i><span id="ui-active-location"></span></span>
        <span id="nasa-status-badge"><span id="nasa-status-dot"></span><span id="nasa-status-text"></span></span>
      </div>
    </div>
  </header>

  <!-- ================= PHONE SIDE BAR ================= -->
  <div id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar" aria-hidden="true">
    <nav class="side-nav" aria-label="Sections">
      <span id="side-hl" aria-hidden="true"></span>
      <button class="side-tab" data-tab="map"><span class="side-num mono">01</span><span data-i18n="tabMap"></span></button>
      <button class="side-tab" data-tab="crops"><span class="side-num mono">02</span><span data-i18n="tabCrops"></span></button>
      <button class="side-tab" data-tab="rotations"><span class="side-num mono">03</span><span data-i18n="tabRotations"></span></button>
      <button class="side-tab" data-tab="about"><span class="side-num mono">04</span><span data-i18n="tabAbout"></span></button>
    </nav>
    <div class="side-settings">
      <button class="side-theme" onclick="toggleTheme(event)">
        <span class="icon-btn" aria-hidden="true">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" stroke-linejoin="round"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        </span>
        <span id="side-theme-label"></span>
      </button>
      <div class="lang-switch mono" role="group" aria-label="Language">
        <span class="lang-thumb" aria-hidden="true"></span>
        <button onclick="setLanguage('mn')" data-lang="mn">МН</button>
        <button onclick="setLanguage('en')" data-lang="en">EN</button>
      </div>
    </div>
    <p class="side-foot mono">2026 NASA SPACE APPS CHALLENGE · FIELD SHIFT</p>
  </aside>

  <main>

    <!-- ================= TAB 1: MAP + CLIMATE ================= -->
    <section class="tab-panel" data-panel="map">
      <div class="wrap hero reveal">
        <p class="kicker mono" data-i18n="heroKicker"></p>
        <h1 class="display" data-i18n="heroTitle"></h1>
        <p class="lead" data-i18n="mapHint"></p>
      </div>

      <div class="wrap reveal">
        <div class="tool">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div class="tool-head mono">
            <span data-i18n="toolKicker"></span>
            <span id="tool-coords">--.--°N --.--°E</span>
          </div>
          <div class="tool-body">
            <div class="map-frame">
              <div id="mongolia-map"></div>

              <div id="map-search">
                <div class="search-box">
                  <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
                  <input id="search-input" type="search" autocomplete="off" />
                </div>
                <ul id="search-results"></ul>
              </div>

              <div id="map-left-controls">
                <div id="map-type-control" class="map-ctrl">
                  <button id="btn-layer-street" onclick="setMapLayer('street')"><span data-i18n="layerMap"></span></button>
                  <button id="btn-layer-satellite" onclick="setMapLayer('satellite')"><span data-i18n="layerSat"></span></button>
                </div>
                <div id="nasa-layer-control" class="map-ctrl">
                  <button id="btn-ov-ndvi" onclick="toggleNasaLayer('ndvi')"><i class="sw sw-ndvi"></i>NDVI</button>
                  <button id="btn-ov-smap" onclick="toggleNasaLayer('smap')"><i class="sw sw-smap"></i>SMAP</button>
                </div>
                <button id="btn-locate" onclick="locateMe()" class="map-ctrl map-ctrl-single">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path stroke-linecap="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="7.5"/></svg>
                  <span data-i18n="locateMe"></span>
                </button>
              </div>
              <div id="nasa-legend" class="hidden"></div>

              <button id="btn-fullscreen" class="fs-btn" onclick="toggleMapFullscreen()" aria-label="Fullscreen">
                <svg class="ic-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                <svg class="ic-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
              <div id="info-card" aria-live="polite"></div>
              <div id="map-toast" class="hidden-toast"></div>
            </div>

            <aside class="tool-side">
              <div class="side-block">
                <p class="kicker mono" data-i18n="panelSelected"></p>
                <p id="side-place" class="side-place"></p>
              </div>
              <div class="side-block" id="alert-banner">
                <p class="kicker mono"><span id="alert-icon" class="alert-dot"></span><span data-i18n="panelRisk"></span></p>
                <h2 id="alert-title" class="side-title"></h2>
                <p id="alert-desc"></p>
                <p id="alert-note"></p>
                <span id="alert-tag" hidden></span>
              </div>
              <div class="side-block">
                <p class="kicker mono" data-i18n="panelRegions"></p>
                <div id="map-quick-pills"></div>
              </div>
            </aside>
          </div>
        </div>
      </div>

      <!-- Climate of the selected point, right under the map -->
      <div class="wrap section reveal">
        <p class="kicker mono">NASA POWER · MERRA-2 · 2006–2025</p>
        <h2 class="display-md" data-i18n="metricsTitle"></h2>
        <div id="metric-cards" class="metric-row"></div>
      </div>

      <div class="wrap section reveal">
        <div class="section-head">
          <div>
            <p class="kicker mono" data-i18n="climateKicker"></p>
            <h3 class="display-sm" data-i18n="climateTitle"></h3>
          </div>
          <div id="season-tabs" class="seg"></div>
        </div>
        <p id="season-readout" class="readout mono"></p>
        <div id="climate-chart" class="chart-box"></div>
        <div class="chart-legend mono">
          <span><i class="lg-bar"></i><span data-i18n="chartRain"></span></span>
          <span><i class="lg-line"></i><span data-i18n="chartTemp"></span></span>
          <span><i class="lg-today"></i><span data-i18n="chartToday"></span></span>
        </div>
      </div>

      <div class="wrap go-links reveal">
        <a href="#crops" class="go-link" onclick="goTab('crops'); return false;"><span class="kicker mono" data-i18n="goCropsKicker"></span><span class="go-title"><span data-i18n="goCropsTitle"></span><span class="go-arrow">→</span></span></a>
        <a href="#rotations" class="go-link" onclick="goTab('rotations'); return false;"><span class="kicker mono" data-i18n="goRotationsKicker"></span><span class="go-title"><span data-i18n="goRotationsTitle"></span><span class="go-arrow">→</span></span></a>
      </div>
    </section>

    <!-- ================= TAB 2: CROPS ================= -->
    <section class="tab-panel" data-panel="crops" hidden>
      <div class="wrap section reveal">
        <p class="kicker mono" data-i18n="cropsKicker"></p>
        <h2 class="display-md" data-i18n="cropsHeading"></h2>
        <p class="lead" data-i18n="cropsSub"></p>
        <div id="pasture-note" class="hidden note-band"></div>
        <div id="crop-grid" class="crop-list"></div>
        <button id="btn-more-crops" onclick="toggleAllCrops()" class="text-btn hidden"></button>
      </div>
    </section>

    <!-- ================= TAB 3: ROTATIONS ================= -->
    <section class="tab-panel" data-panel="rotations" hidden>
      <div class="wrap section reveal">
        <p class="kicker mono" data-i18n="rotationsKicker"></p>
        <h2 class="display-md" data-i18n="strategyHeading"></h2>
        <p class="lead" data-i18n="strategySub"></p>

        <div class="inputs-row">
          <div class="input-group">
            <span class="kicker mono" data-i18n="currentCropLabel"></span>
            <div class="dd" id="crop-dd">
              <div class="dd-shell">
                <button type="button" class="dd-btn" id="dd-btn" onclick="toggleCropMenu()" aria-haspopup="listbox" aria-expanded="false">
                  <span id="dd-label"></span>
                  <svg class="dd-chev" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1.5l5 5 5-5"/></svg>
                </button>
                <ul class="dd-list" id="dd-list" role="listbox"></ul>
              </div>
            </div>
          </div>
          <div class="input-group">
            <span class="kicker mono" data-i18n="controlsHeading"></span>
            <div id="priority-buttons" class="seg"></div>
          </div>
          <label class="input-group switch">
            <input id="irrigation-toggle" type="checkbox" onchange="setIrrigation(this.checked)" />
            <span class="switch-track" aria-hidden="true"><span></span></span>
            <span data-i18n="irrigationLabel"></span>
          </label>
        </div>

        <div id="compare" class="compare"></div>
      </div>

      <div id="strategy-detail-panel" class="wrap section"></div>

      <div class="wrap section">
        <h3 class="display-sm" data-i18n="tableHeading"></h3>
        <div id="strategy-list-mobile"></div>
        <div class="table-wrap">
          <table class="hds-table">
            <thead>
              <tr>
                <th>#</th>
                <th data-i18n="thStrategy"></th>
                <th data-i18n="thCrops"></th>
                <th data-i18n="thFit"></th>
                <th data-i18n="thSoil"></th>
                <th data-i18n="thWater"></th>
                <th data-i18n="thFeed"></th>
              </tr>
            </thead>
            <tbody id="strategy-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- ================= TAB 4: METHOD ================= -->
    <section class="tab-panel" data-panel="about" hidden>
      <div class="wrap section reveal">
        <p class="kicker mono" data-i18n="aboutKicker"></p>
        <h2 class="display-md" data-i18n="aboutTitle"></h2>
        <p class="lead" data-i18n="footerMethod"></p>
      </div>
      <div class="wrap section reveal">
        <h3 class="display-sm" data-i18n="sourcesTitle"></h3>
        <p class="body-text" data-i18n="footerSources"></p>
        <p class="body-text muted" data-i18n="resolutionNote"></p>
      </div>
    </section>
  </main>

  <footer id="footer">
    <div class="wrap footer-inner">
      <p class="kicker mono" data-i18n="disclaimerKicker"></p>
      <p data-i18n="disclaimer" class="footer-disclaimer"></p>
      <div class="footer-meta mono">
        <span>NASA POWER · MODIS · SMAP</span>
        <span>2026 NASA SPACE APPS CHALLENGE · FIELD SHIFT</span>
      </div>
    </div>
  </footer>

  <!-- Order matters: data → translations → NASA → scoring → app → effects -->
  <script src="js/mongolia-border.js"></script>
  <script src="js/mongolia-lakes.js"></script>
  <script src="js/mongolia-aimags.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nasa.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
